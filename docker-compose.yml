services:
  api:
    build: .
    container_name: notification_api
    ports:
      - "8001:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0 --port 8000 --reload

  postgres:
    image: postgres:17
    container_name: notification_postgres
    environment:
      POSTGRES_USER: notification_user
      POSTGRES_PASSWORD: notification_password
      POSTGRES_DB: notification_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification_user -d notification_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    container_name: notification_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    
  redis:
    image: redis:7-alpine
    container_name: notification_redis
    ports:
      - "6379:6379"

  worker:
    build: .
    container_name: notification_worker
    command: >
      celery -A workers.celery_app:celery_app
      worker
      --loglevel=info
      --concurrency=2
      --without-gossip
      --without-mingle
      -Q telegram_queue,email_queue
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started

volumes:
  postgres_data:
  